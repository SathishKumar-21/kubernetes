apiVersion: v1
kind: Pod
metadata:
  name: restart-test
spec:
  containers:
    - name: flask
      image: bsathish24/flask-app:v2
      ports:
        - containerPort: 5000
      livenessProbe:
        httpGet:
          path: /health
          port: 9999
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 2
